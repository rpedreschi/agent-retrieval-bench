# Variant B — single consolidated context engine, backed by DeltaStream.
#
# DeltaStream credentials come from environment variables; never check them
# into config. See .env.example for the variables the entrypoint reads.
#
# freshness_sla_ms is per-view, with a "default" applied to any view that
# does not set its own. The default of 250 ms is the contract DeltaStream is
# expected to honour; per-view overrides exist to support cases where one
# view legitimately tolerates more lag than another.

auth:
  tokens:
    "arb-variant-b-token":
      - "context:read"

freshness_sla_ms:
  default:             250
  customer_360:        250
  order_state:         250
  returns_eligibility: 250
