[project]
name = "agent-retrieval-bench"
version = "0.1.0"
description = "Benchmark comparing MCP-per-source vs context-engine retrieval architectures for production AI agents."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
readme = "README.md"
dependencies = [
    "confluent-kafka[avro]>=2.5.0",
    "fastavro>=1.9.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "click>=8.1",
    "structlog>=24.1",
    "numpy>=1.26",
    "mcp>=1.2",
    "httpx>=0.27",
    "inspect-ai>=0.3",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "types-PyYAML",
    "fastavro>=1.9",
]
observability = [
    "ragas>=0.2",
    "langfuse>=2.40",
]
tau-bench = [
    # Reference task templates for the retail domain. Pulled as a git
    # dependency so we can iterate against a known good revision.
    "tau-bench @ git+https://github.com/sierra-research/tau-bench@main",
]

[project.scripts]
arb = "arb.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arb"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/arb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
